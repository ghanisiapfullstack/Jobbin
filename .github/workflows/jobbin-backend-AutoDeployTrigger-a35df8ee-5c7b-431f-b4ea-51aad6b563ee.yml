name: Trigger auto deployment for jobbin-backend

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/jobbin-backend-AutoDeployTrigger-a35df8ee-5c7b-431f-b4ea-51aad6b563ee.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      CONTAINER_APP_NAME: jobbin-backend
      RESOURCE_GROUP: jobbin-rg
      IMAGE_NAME: jobbinregistry.azurecr.io/jobbin-backend:${{ github.sha }}
      GOOGLE_AUTH_SMOKE_URL: https://api.jobbin.site/api/v1/auth/google
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.JOBBINBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.JOBBINBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.JOBBINBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: ./Dockerfile
          registryUrl: jobbinregistry.azurecr.io
          registryUsername: ${{ secrets.JOBBINBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.JOBBINBACKEND_REGISTRY_PASSWORD }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToBuild: ${{ env.IMAGE_NAME }}

      - name: Verify deployed revision is ready
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..18}; do
            latest_revision="$(az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.latestRevisionName \
              --output tsv)"
            latest_ready_revision="$(az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.latestReadyRevisionName \
              --output tsv)"

            if [[ -n "$latest_revision" && "$latest_revision" == "$latest_ready_revision" ]]; then
              health_state="$(az containerapp revision show \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --revision "$latest_revision" \
                --query properties.healthState \
                --output tsv)"
              running_state="$(az containerapp revision show \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --revision "$latest_revision" \
                --query properties.runningState \
                --output tsv)"
              deployed_image="$(az containerapp revision show \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --revision "$latest_revision" \
                --query 'properties.template.containers[0].image' \
                --output tsv)"
              app_key_secret_ref="$(az containerapp revision show \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --revision "$latest_revision" \
                --query "properties.template.containers[0].env[?name=='APP_KEY'].secretRef | [0]" \
                --output tsv)"

              # Azure reports a healthy revision at its configured replica ceiling as
              # RunningAtMaxScale rather than Running. Both are ready states.
              if [[ "$health_state" == "Healthy" && "$running_state" == Running* && "$deployed_image" == "$IMAGE_NAME" && -n "$app_key_secret_ref" ]]; then
                echo "Revision $latest_revision is ready with the expected image and APP_KEY secret reference."
                exit 0
              fi
            fi

            echo "Waiting for the latest revision to become ready (attempt $attempt/18)..."
            sleep 10
          done

          echo "Latest revision did not become ready with the expected image and APP_KEY secret reference."
          az containerapp revision list \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query '[].{name:name,active:properties.active,health:properties.healthState,running:properties.runningState,image:properties.template.containers[0].image}' \
            --output table
          exit 1

      - name: Smoke test Google auth route
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/google-auth-smoke-response.json"

          for attempt in {1..6}; do
            http_status="$(curl \
              --silent \
              --show-error \
              --max-time 20 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Content-Type: application/json' \
              --data '{"credential":"deployment-smoke-invalid-token"}' \
              "$GOOGLE_AUTH_SMOKE_URL" || true)"

            if [[ "$http_status" == "401" ]] && grep --quiet 'Token Google tidak valid' "$response_file"; then
              echo "Google auth route smoke test passed."
              exit 0
            fi

            echo "Google auth smoke test returned HTTP $http_status (attempt $attempt/6)."
            sleep 5
          done

          echo "Google auth route smoke test failed."
          exit 1
